<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('System Audit Trail – HouseKeepTrack Hotel')}"></head>
<body>

    <!-- NAVIGATION -->
    <nav th:replace="~{fragments/header :: navbar}"></nav>

    <!-- HEADER TITLE BANNER -->
    <div style="background: var(--bg-secondary); border-bottom: 1px solid var(--gold-border); padding: 40px 24px;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px;">
            <div>
                <span class="section-label">COMPLIANCE &amp; SECURITY RECORD</span>
                <h1 style="font-size: 2.2rem; font-weight: 700;">System Audit Logs</h1>
                <p style="color: var(--text-secondary); font-size: 13.5px; margin-top: 4px;">
                    Immutable transactional log of all room status transitions, task dispatches, checkouts, and inspection audits.
                </p>
            </div>
            <button class="btn-luxury-outline" onclick="loadAuditLogs()">⟳ Refresh Logs</button>
        </div>
    </div>

    <!-- MAIN LOGS TABLE -->
    <section style="padding: 45px 24px; min-height: 75vh; background: var(--bg-primary);">
        <div class="container">
            <div class="table-responsive">
                <table class="luxury-table">
                    <thead>
                        <tr>
                            <th>Log ID</th>
                            <th>Entity Type</th>
                            <th>Target ID</th>
                            <th>Action Event</th>
                            <th>Old Value</th>
                            <th>New Value</th>
                            <th>Changed By</th>
                            <th>Timestamp</th>
                        </tr>
                    </thead>
                    <tbody id="audit-logs-tbody">
                        <tr><td colspan="8" class="text-center" style="padding: 30px; color: #888;">Loading audit records...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script>
        document.addEventListener('DOMContentLoaded', loadAuditLogs);

        async function loadAuditLogs() {
            const tbody = document.getElementById('audit-logs-tbody');
            if (!tbody) return;

            try {
                const res = await fetch('/api/audit-logs');
                if (!res.ok) throw new Error('Failed to load audit logs');
                const logs = await res.json();

                tbody.innerHTML = '';
                if (logs.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center" style="padding: 24px; color: #888;">No audit entries logged yet.</td></tr>';
                    return;
                }

                logs.forEach(l => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>#${l.id}</td>
                        <td><span class="status-badge" style="background:#f4efe6; color:#4a4d52;">${l.entityType}</span></td>
                        <td>${l.entityId || '-'}</td>
                        <td><strong>${l.action}</strong></td>
                        <td><span style="color:#c22929;">${l.oldValue || '-'}</span></td>
                        <td><strong style="color:#107c41;">${l.newValue || '-'}</strong></td>
                        <td>${l.changedBy}</td>
                        <td>${l.changedAt ? l.changedAt.replace('T', ' ').substring(0, 19) : '-'}</td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (e) {
                console.error('Error fetching audit logs', e);
            }
        }
    </script>
</body>
</html>
